<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HireLens — CrewAI Edition</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #0d0f14; --surface: #151820; --surface2: #1c2030; --border: #252a3a;
  --accent: #4fffb0; --accent2: #4db8ff; --warn: #ff6b6b; --text: #e2e8f0; --muted: #64748b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 12px; padding: 14px 28px; border-bottom: 1px solid var(--border); background: var(--surface); }
.logo { font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600; color: var(--accent); }
.logo span { color: var(--text); }
.subtitle { font-size: 12px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }
.status-badge { margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border); color: var(--muted); transition: all 0.3s; }
.status-badge.active { border-color: var(--accent); color: var(--accent); }
.status-badge.done   { border-color: var(--accent2); color: var(--accent2); }
.main { display: grid; grid-template-columns: 280px 1fr 260px; flex: 1; height: calc(100vh - 53px); overflow: hidden; }
.sidebar-left { background: var(--surface); border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
.section-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
input[type="text"] { width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 9px 11px; border-radius: 6px; font-size: 13px; margin-bottom: 10px; }
input[type="text"]:focus { outline: none; border-color: var(--accent); }
input[type="file"] { width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 9px 11px; border-radius: 6px; font-size: 12px; cursor: pointer; margin-bottom: 10px; }
.btn { width: 100%; padding: 10px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; margin-bottom: 6px; }
.btn-primary { background: var(--accent); color: #0d0f14; }
.btn-primary:hover { opacity: 0.85; }
.btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }
.resume-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; display: none; }
.resume-card.visible { display: block; }
.resume-name { font-size: 14px; font-weight: 600; color: var(--accent); margin-bottom: 6px; }
.resume-field { font-size: 11px; color: var(--muted); margin-bottom: 3px; line-height: 1.5; }
.resume-field strong { color: var(--text); }
.questions-list { display: none; }
.questions-list.visible { display: block; }
.question-item { font-size: 11px; color: var(--muted); padding: 7px 9px; border-radius: 5px; border-left: 2px solid var(--border); margin-bottom: 5px; line-height: 1.4; transition: all 0.2s; }
.question-item.active { border-color: var(--accent); color: var(--text); background: rgba(79,255,176,0.05); }
.question-item.done { border-color: var(--muted); opacity: 0.4; text-decoration: line-through; }
.thinking { display: none; align-items: center; gap: 8px; padding: 9px 12px; background: rgba(79,255,176,0.05); border: 1px solid rgba(79,255,176,0.15); border-radius: 6px; font-size: 11px; color: var(--accent); font-family: 'IBM Plex Mono', monospace; }
.thinking.visible { display: flex; }
.spin { width: 12px; height: 12px; border: 2px solid rgba(79,255,176,0.2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }
.chat-area { display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }
.chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; }
.chat-messages::-webkit-scrollbar { width: 3px; }
.chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.message { display: flex; gap: 10px; animation: fadeUp 0.3s ease forwards; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.message.candidate { flex-direction: row-reverse; }
.avatar { width: 30px; height: 30px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; flex-shrink: 0; }
.avatar.ai { background: rgba(79,255,176,0.15); color: var(--accent); border: 1px solid rgba(79,255,176,0.3); }
.avatar.candidate { background: rgba(77,184,255,0.15); color: var(--accent2); border: 1px solid rgba(77,184,255,0.3); }
.bubble { max-width: 72%; padding: 11px 14px; border-radius: 10px; font-size: 13px; line-height: 1.6; }
.message.ai .bubble { background: var(--surface); border: 1px solid var(--border); border-top-left-radius: 3px; }
.message.candidate .bubble { background: rgba(77,184,255,0.08); border: 1px solid rgba(77,184,255,0.2); border-top-right-radius: 3px; }
.typing-indicator { display: none; }
.typing-indicator.visible { display: flex; }
.typing-dots { display: flex; gap: 4px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; border-top-left-radius: 3px; }
.dot { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); animation: bounce 1.2s infinite; }
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,80%,100% { transform: translateY(0); opacity: 0.4; } 40% { transform: translateY(-5px); opacity: 1; } }
.chat-input-area { padding: 14px 20px; border-top: 1px solid var(--border); background: var(--surface); display: flex; gap: 10px; align-items: flex-end; }
textarea { flex: 1; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 11px 13px; border-radius: 7px; font-size: 13px; font-family: 'IBM Plex Sans', sans-serif; resize: none; min-height: 44px; max-height: 110px; line-height: 1.5; transition: border-color 0.2s; }
textarea:focus { outline: none; border-color: var(--accent); }
textarea:disabled { opacity: 0.35; }
.send-btn { width: 44px; height: 44px; background: var(--accent); color: #0d0f14; border: none; border-radius: 7px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: opacity 0.2s; flex-shrink: 0; }
.send-btn:hover { opacity: 0.85; }
.send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--muted); }
.empty-icon { font-size: 36px; opacity: 0.35; }
.empty-text { font-size: 13px; text-align: center; line-height: 1.6; }
.sidebar-right { background: var(--surface); border-left: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
.score-item { margin-bottom: 10px; }
.score-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.score-label span:last-child { font-family: 'IBM Plex Mono', monospace; color: var(--accent); }
.score-bar { height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
.score-fill { height: 100%; background: var(--accent); border-radius: 2px; width: 0%; transition: width 0.6s ease; }
.result-card { display: none; }
.result-card.visible { display: block; }
.verdict { font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 600; text-align: center; padding: 10px; border-radius: 7px; margin-bottom: 12px; }
.verdict.hire   { background: rgba(79,255,176,0.1); color: #4fffb0; border: 1px solid rgba(79,255,176,0.3); }
.verdict.nohire { background: rgba(255,107,107,0.1); color: #ff6b6b; border: 1px solid rgba(255,107,107,0.3); }
.result-score { text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 32px; font-weight: 600; margin-bottom: 2px; }
.result-score-label { text-align: center; font-size: 11px; color: var(--muted); margin-bottom: 12px; }
.result-summary { font-size: 12px; line-height: 1.6; color: var(--muted); padding: 9px; background: var(--surface2); border-radius: 6px; border: 1px solid var(--border); margin-bottom: 12px; }
.tag-list { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
.tag { font-size: 10px; padding: 3px 7px; border-radius: 4px; font-family: 'IBM Plex Mono', monospace; }
.tag.strength { background: rgba(79,255,176,0.1); color: #4fffb0; border: 1px solid rgba(79,255,176,0.2); }
.tag.weakness { background: rgba(255,107,107,0.1); color: #ff6b6b; border: 1px solid rgba(255,107,107,0.2); }
.recommendation { font-size: 11px; color: var(--muted); line-height: 1.5; font-style: italic; }
</style>
</head>
<body>

<header>
  <div class="logo">Hire<span>Lens</span></div>
  <div class="subtitle">CrewAI · 5 Agents · Ollama Mistral</div>
  <div class="status-badge" id="statusBadge">● IDLE</div>
</header>

<div class="main">
  <div class="sidebar-left">
    <div>
      <div class="section-label">Setup</div>
      <label>Job Role</label>
      <input type="text" id="roleInput" value="Software Engineer"/>
      <label>Resume (PDF)</label>
      <input type="file" id="resumeFile" accept=".pdf"/>
      <button class="btn btn-primary" id="uploadBtn" onclick="startSetup()">Upload &amp; Start Interview</button>
    </div>
    <div class="resume-card" id="resumeCard">
      <div class="section-label">Parsed Resume</div>
      <div class="resume-name" id="resumeName">—</div>
      <div class="resume-field" id="resumeEmail"></div>
      <div class="resume-field" id="resumeSkills"></div>
    </div>
    <div class="questions-list" id="questionsList">
      <div class="section-label">Interview Plan</div>
      <div id="questionsContainer"></div>
    </div>
    <div class="thinking" id="thinkingBox">
      <div class="spin"></div>
      <span id="thinkingText">Agents working...</span>
    </div>
  </div>

  <div class="chat-area">
    <div class="chat-messages" id="chatMessages">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">🤖</div>
        <div class="empty-text">Upload a resume and set the job role<br/>to begin the AI interview</div>
      </div>
    </div>
    <div style="padding: 0 20px 4px;">
      <div class="message ai typing-indicator" id="typingIndicator">
        <div class="avatar ai">AI</div>
        <div class="typing-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      </div>
    </div>
    <div class="chat-input-area">
      <textarea id="answerInput" placeholder="Type your answer here... (Enter to send)" rows="1" disabled onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendAnswer()" disabled>➤</button>
    </div>
  </div>

  <div class="sidebar-right">
    <div>
      <div class="section-label">Live Scores</div>
      <div id="scoreBars"><div style="font-size:12px;color:var(--muted);">Scores appear as you answer.</div></div>
    </div>
    <div class="result-card" id="resultCard">
      <div class="section-label" style="margin-bottom:10px;">Final Verdict</div>
      <div class="verdict" id="verdictBadge">—</div>
      <div class="result-score" id="overallScore">—</div>
      <div class="result-score-label">Overall Score</div>
      <div class="result-summary" id="resultSummary"></div>
      <div class="section-label">Strengths</div>
      <div class="tag-list" id="strengthTags"></div>
      <div class="section-label">Areas to Improve</div>
      <div class="tag-list" id="weaknessTags"></div>
      <div class="recommendation" id="recommendation"></div>
    </div>
  </div>
</div>

<script>
  let sessionId = null;
  let interviewActive = false;
  let questionIndex = 0;
  let allQuestions = [];

  async function startSetup() {
    const file = document.getElementById("resumeFile").files[0];
    const role = document.getElementById("roleInput").value.trim();
    if (!file) { alert("Please select a PDF resume."); return; }
    if (!role)  { alert("Please enter a job role."); return; }

    setThinking(true, "Agent 1 + 2 running (parsing + planning)...");
    document.getElementById("uploadBtn").disabled = true;
    setStatus("PROCESSING", "");

    const form = new FormData();
    form.append("file", file);
    form.append("role", role);

    try {
      const res  = await fetch("/api/upload", { method: "POST", body: form });
      const data = await res.json();
      if (data.error) { alert(data.error); setThinking(false); document.getElementById("uploadBtn").disabled=false; return; }

      sessionId = data.session_id;
      allQuestions = data.questions;

      const r = data.resume;
      document.getElementById("resumeName").textContent  = r.name  || "Unknown";
      document.getElementById("resumeEmail").innerHTML   = `<strong>Email:</strong> ${r.email || "—"}`;
      document.getElementById("resumeSkills").innerHTML  = `<strong>Skills:</strong> ${(r.skills || "—").substring(0, 80)}...`;
      document.getElementById("resumeCard").classList.add("visible");

      renderQuestions(allQuestions);
      highlightQuestion(0);

      document.getElementById("emptyState").style.display = "none";
      renderScoreBars(allQuestions.length);
      addMessage("ai", data.opening_message);

      interviewActive = true;
      questionIndex = 0;
      document.getElementById("answerInput").disabled = false;
      document.getElementById("sendBtn").disabled = false;
      document.getElementById("answerInput").focus();
      setStatus("LIVE", "active");
    } catch(e) {
      alert("Something went wrong. Is the Flask server running?");
      console.error(e);
    }
    setThinking(false);
    document.getElementById("uploadBtn").disabled = false;
  }

  async function sendAnswer() {
    const input = document.getElementById("answerInput");
    const message = input.value.trim();
    if (!message || !interviewActive) return;

    addMessage("candidate", message);
    input.value = ""; input.style.height = "auto";
    input.disabled = true;
    document.getElementById("sendBtn").disabled = true;
    showTyping(true);
    setThinking(true, "Agent 3 + 4 running (responding + evaluating)...");

    try {
      const res = await fetch("/api/respond", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, message })
      });
      const data = await res.json();
      showTyping(false);
      setThinking(false);
      addMessage("ai", data.message);

      if (data.score && data.decision !== "FOLLOW_UP") {
        updateScoreBar(questionIndex, data.score);
        questionIndex++;
        highlightQuestion(questionIndex);
      }

      if (data.interview_done) {
        interviewActive = false;
        input.disabled = true;
        document.getElementById("sendBtn").disabled = true;
        setStatus("EVALUATING", "");
        await finishInterview();
      } else {
        input.disabled = false;
        document.getElementById("sendBtn").disabled = false;
        input.focus();
      }
    } catch(e) {
      showTyping(false); setThinking(false);
      addMessage("ai", "Sorry, something went wrong. Please try again.");
      input.disabled = false;
      document.getElementById("sendBtn").disabled = false;
      console.error(e);
    }
  }

  async function finishInterview() {
    setThinking(true, "Agent 5 generating final report...");
    try {
      const res = await fetch("/api/finish", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId })
      });
      const result = await res.json();
      setThinking(false);
      setStatus("DONE", "done");
      showFinalResult(result);
    } catch(e) {
      setThinking(false);
      console.error(e);
    }
  }

  function showFinalResult(result) {
    const isHire = result.final_verdict === "Hire";
    const v = document.getElementById("verdictBadge");
    v.textContent = isHire ? "✓ HIRE" : "✗ NO HIRE";
    v.className = `verdict ${isHire ? "hire" : "nohire"}`;
    document.getElementById("overallScore").textContent = `${result.overall_score}/100`;
    document.getElementById("resultSummary").textContent = result.summary || "";
    document.getElementById("recommendation").textContent = result.recommendation || "";

    const sTags = document.getElementById("strengthTags");
    sTags.innerHTML = "";
    (result.strengths || []).forEach(s => {
      const t = document.createElement("div"); t.className = "tag strength"; t.textContent = s; sTags.appendChild(t);
    });
    const wTags = document.getElementById("weaknessTags");
    wTags.innerHTML = "";
    (result.weaknesses || []).forEach(w => {
      const t = document.createElement("div"); t.className = "tag weakness"; t.textContent = w; wTags.appendChild(t);
    });
    document.getElementById("resultCard").classList.add("visible");
  }

  function addMessage(role, text) {
    const chat = document.getElementById("chatMessages");
    const div  = document.createElement("div");
    div.className = `message ${role}`;
    div.innerHTML = `<div class="avatar ${role}">${role === "ai" ? "AI" : "YOU"}</div><div class="bubble">${escHtml(text).replace(/\n/g, "<br/>")}</div>`;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function renderQuestions(questions) {
    const c = document.getElementById("questionsContainer");
    c.innerHTML = "";
    questions.forEach((q, i) => {
      const d = document.createElement("div");
      d.className = "question-item"; d.id = `q-${i}`; d.textContent = `${i+1}. ${q}`;
      c.appendChild(d);
    });
    document.getElementById("questionsList").classList.add("visible");
  }

  function highlightQuestion(index) {
    allQuestions.forEach((_, i) => {
      const el = document.getElementById(`q-${i}`);
      if (!el) return;
      if (i < index) el.className = "question-item done";
      else if (i === index) el.className = "question-item active";
      else el.className = "question-item";
    });
  }

  function renderScoreBars(count) {
    const c = document.getElementById("scoreBars");
    c.innerHTML = "";
    for (let i = 0; i < count; i++) {
      c.innerHTML += `<div class="score-item"><div class="score-label"><span>Q${i+1}</span><span id="sv-${i}">—</span></div><div class="score-bar"><div class="score-fill" id="sf-${i}"></div></div></div>`;
    }
  }

  function updateScoreBar(index, score) {
    const fill = document.getElementById(`sf-${index}`);
    const val  = document.getElementById(`sv-${index}`);
    if (!fill || !val) return;
    fill.style.width = (score / 10 * 100) + "%";
    fill.style.background = score >= 7 ? "var(--accent)" : score >= 4 ? "#fbbf24" : "var(--warn)";
    val.textContent = `${score}/10`;
  }

  function showTyping(show) {
    document.getElementById("typingIndicator").className = "message ai typing-indicator" + (show ? " visible" : "");
    if (show) { const c = document.getElementById("chatMessages"); c.scrollTop = c.scrollHeight; }
  }

  function setThinking(show, text="") {
    document.getElementById("thinkingText").textContent = text;
    document.getElementById("thinkingBox").className = "thinking" + (show ? " visible" : "");
  }

  function setStatus(text, cls) {
    const el = document.getElementById("statusBadge");
    el.textContent = `● ${text}`;
    el.className = "status-badge" + (cls ? ` ${cls}` : "");
  }

  function handleKey(e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendAnswer(); } }
  function autoResize(el) { el.style.height = "auto"; el.style.height = Math.min(el.scrollHeight, 110) + "px"; }
  function escHtml(t) { return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
</script>
</body>
</html>
